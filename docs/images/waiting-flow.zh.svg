<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="920" height="600" role="img" aria-label="一个会话怎么被归到「等你回复」">
<title>一个会话怎么被归到「等你回复」</title>
<style>
  .bg{fill:#ffffff}.box{fill:#f7f8fa;stroke:#d6dbe2}.opt{fill:#ffffff;stroke:#c3c9d2;stroke-dasharray:5 4}
  .main{fill:#eef3ff;stroke:#9db5ef}.wait{fill:#fff5e5;stroke:#f0c27c}.ok{fill:#e7f4ec;stroke:#a9d6ba}.idle{fill:#f0f1f3;stroke:#cfd3d9}
  .t{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif;fill:#1c2430}
  .s{font:12.5px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif;fill:#5d6774}
  .m{font:12px ui-monospace,"SF Mono",Menlo,Consolas,monospace;fill:#5d6774}
  .l{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif;fill:#2453c7}
  .n{font:700 12px -apple-system,BlinkMacSystemFont,sans-serif;fill:#ffffff}.dot{fill:#2453c7}
  .tw{fill:#a8540a}.to{fill:#1b7f45}.ti{fill:#5d6774}
  .a{stroke:#2453c7;stroke-width:1.6;fill:none;marker-end:url(#arrow)}.ag{stroke:#8b94a0;stroke-width:1.4;fill:none;marker-end:url(#arrowg)}
  #arrow path{fill:#2453c7}#arrowg path{fill:#8b94a0}
  @media (prefers-color-scheme: dark){
    .bg{fill:#161920}.box{fill:#1d222b;stroke:#323946}.opt{fill:#161920;stroke:#4a515c}.main{fill:rgba(122,162,255,.12);stroke:#4d6fc4}
    .wait{fill:rgba(242,180,90,.12);stroke:#8f6427}.ok{fill:rgba(95,208,140,.11);stroke:#2f8a57}.idle{fill:#1d222b;stroke:#3a404b}
    .t{fill:#e6e8ec}.s,.m{fill:#a2abb6}.l{fill:#86a6ff}.dot{fill:#4d6fc4}.tw{fill:#f2b45a}.to{fill:#5fd08c}.ti{fill:#a2abb6}
    .a{stroke:#86a6ff}#arrow path{fill:#86a6ff}.ag{stroke:#737d89}#arrowg path{fill:#737d89}
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker>
  <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect width="920" height="600" rx="14" class="bg"/>
<rect x="50" y="24" width="350" height="44" rx="10" class="box"/>
<text x="225" y="54" class="t" text-anchor="middle">会话停下来，或者有了新消息</text>
<path class="a" d="M225 68 V94"/>
<rect x="50" y="98" width="350" height="62" rx="10" class="box"/>
<text x="225" y="124" class="t" text-anchor="middle">有等你回答的提问框、待批准的命令</text>
<text x="225" y="142" class="s" text-anchor="middle">或「开新会话」卡片吗？</text>
<path class="a" d="M402 129 H516"/>
<text x="460" y="122" class="l" text-anchor="middle">是</text>
<rect x="520" y="98" width="350" height="62" rx="10" class="wait"/>
<text x="695" y="124" class="t" text-anchor="middle">等你回复</text>
<text x="695" y="142" class="s" text-anchor="middle">原样显示那个请求</text>
<path class="a" d="M225 160 V192"/>
<text x="233" y="182" class="l" text-anchor="start">否</text>
<rect x="50" y="196" width="350" height="62" rx="10" class="box"/>
<text x="225" y="222" class="t" text-anchor="middle">最后一条消息</text>
<text x="225" y="240" class="s" text-anchor="middle">是助手发的吗？</text>
<path class="a" d="M402 227 H516"/>
<text x="460" y="220" class="l" text-anchor="middle">否</text>
<rect x="520" y="196" width="350" height="62" rx="10" class="idle"/>
<text x="695" y="222" class="t" text-anchor="middle">不算等你</text>
<text x="695" y="240" class="s" text-anchor="middle">它正在处理你的消息</text>
<path class="a" d="M225 258 V290"/>
<text x="233" y="280" class="l" text-anchor="start">是</text>
<rect x="50" y="294" width="350" height="48" rx="10" class="box"/>
<text x="225" y="324" class="t" text-anchor="middle">打开了模型总结吗？</text>
<path class="a" d="M402 318 H516"/>
<text x="460" y="311" class="l" text-anchor="middle">是</text>
<rect x="520" y="288" width="350" height="62" rx="10" class="main"/>
<text x="695" y="314" class="t" text-anchor="middle">模型读最近 80 条消息</text>
<text x="695" y="332" class="s" text-anchor="middle">列出你还没回应的事</text>
<path class="a" d="M225 342 V374"/>
<text x="233" y="364" class="l" text-anchor="start">否</text>
<rect x="50" y="378" width="350" height="62" rx="10" class="main"/>
<text x="225" y="404" class="t" text-anchor="middle">按规则摘出问题</text>
<text x="225" y="422" class="s" text-anchor="middle">只看你最后一条消息之后的回复</text>
<path class="ag" d="M695 350 V466 H608 V484"/>
<path class="ag" d="M695 466 H782 V484"/>
<rect x="528" y="488" width="160" height="52" rx="10" class="wait"/>
<text x="608" y="509" class="s" text-anchor="middle">摘到了</text>
<text x="608" y="528" class="t tw" text-anchor="middle">等你回复</text>
<rect x="702" y="488" width="160" height="52" rx="10" class="ok"/>
<text x="782" y="509" class="s" text-anchor="middle">没有</text>
<text x="782" y="528" class="t to" text-anchor="middle">已完成</text>
<path class="ag" d="M225 440 V466 H138 V484"/>
<path class="ag" d="M225 466 H312 V484"/>
<rect x="58" y="488" width="160" height="52" rx="10" class="wait"/>
<text x="138" y="509" class="s" text-anchor="middle">摘到了</text>
<text x="138" y="528" class="t tw" text-anchor="middle">等你回复</text>
<rect x="232" y="488" width="160" height="52" rx="10" class="ok"/>
<text x="312" y="509" class="s" text-anchor="middle">没有</text>
<text x="312" y="528" class="t to" text-anchor="middle">已完成</text>
<text x="460" y="574" class="s" text-anchor="middle">还在运行、但之前问你的事没回？也会列进来，并标「还在运行」。</text>
</svg>
