name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # ubuntu-latest no longer ships Python 3.9 for setup-python
          - os: ubuntu-24.04
            python: "3.9"
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Private words stay out (the word list is a repository secret; skipped without it)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python scripts/leak_guard.py
        env:
          CCM_LEAK_WORDS: ${{ secrets.CCM_LEAK_WORDS }}
      - name: Starts from a download, and installs as a command
        run: |
          python run.py --help
          python run.py --version
          python -m pip install .
          claude-codex-monitor --version
